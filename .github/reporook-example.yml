failOn: high
outputDir: .reporook
gitHistory: false
cacheEnabled: false
paths:
  - .
ignore:
  - node_modules/**
  - dist/**
  - build/**
  - .git/**
  - .reporook/**
requiredScanners:
  - gitleaks
  - npm-audit
scanners:
  semgrep: false
  gitleaks: true
  npm-audit: true
  pip-audit: false
  osv-scanner: false
  checkov: false
  trivy-image: false
