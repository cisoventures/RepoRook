name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run fixture:prepare
      - run: ./action/install-scanners.sh
      - name: Confirm missing Python hash lock fails closed
        shell: bash
        run: |
          set +e
          node cli/dist/index.js scan test-fixtures/vulnerable-app --require-scanners --fail-on high
          code=$?
          set -e
          test "$code" -eq 2
          node -e "const r=require('./test-fixtures/vulnerable-app/.reporook/findings.json'); const python=['semgrep','pip-audit','checkov'].map(name=>r.scanners.find(s=>s.name===name)); if(r.coverage_status==='complete'||python.some(s=>s?.available!==false||!s.reason?.includes('repository-owned hash lock'))) process.exit(1)"
      - name: Confirm verification preserves the baseline
        if: hashFiles('action/python-scanners.requirements.txt') != ''
        run: npm run fixture:verify
      - name: Confirm the guided fix queue and approval boundary
        if: hashFiles('action/python-scanners.requirements.txt') != ''
        run: npm run fixture:guided
      - name: Confirm new-findings baseline policy
        if: hashFiles('action/python-scanners.requirements.txt') != ''
        run: npm run fixture:policy
