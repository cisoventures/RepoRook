name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require a bundled npm that supports trusted staged publishing
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          if [[ ! "$npm_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unrecognized npm version: $npm_version" >&2
            exit 2
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          if (( major < 11 || (major == 11 && minor < 15) )); then
            echo "The npm bundled with the selected Node.js toolchain is $npm_version; staged trusted publishing requires npm 11.15.0 or later." >&2
            echo "Refusing to download and execute a replacement package manager inside the release job." >&2
            exit 2
          fi
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Resolve release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            tag="v${version}"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Confirm tag and package versions agree
        shell: bash
        run: |
          test "$RELEASE_VERSION" = "$(node -p "require('./cli/package.json').version")"
          test "$RELEASE_VERSION" = "$(node -p "require('./mcp-server/package.json').version")"
          test "$RELEASE_VERSION" = "$(node -p "require('./service/package.json').version")"
      - name: Pack npm distributions
        run: |
          mkdir release
          npm pack --workspace reporook --pack-destination release
          npm pack --workspace @reporook/mcp-server --pack-destination release
          npm pack --workspace @reporook/service --pack-destination release
      - name: Install and execute packed distributions
        run: node scripts/smoke-packages.mjs release
      - name: Create the release tag for a manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          existing="$(git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" || true)"
          if [[ -n "$existing" ]]; then
            test "$existing" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Stage npm distributions through trusted publishing
        shell: bash
        run: |
          npm stage publish "./release/reporook-${RELEASE_VERSION}.tgz" --access public
          npm stage publish "./release/reporook-mcp-server-${RELEASE_VERSION}.tgz" --access public
          npm stage publish "./release/reporook-service-${RELEASE_VERSION}.tgz" --access public
      - name: Archive native adapters
        run: tar -czf release/reporook-adapters-${RELEASE_TAG}.tar.gz adapters
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: release/*
