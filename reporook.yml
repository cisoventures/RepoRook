failOn: high
outputDir: .reporook
semgrepConfig: p/default
gitHistory: false
cacheEnabled: true
cacheTtlMinutes: 15
scannerRetries: 1
containerImages: []
paths:
  - .
ignore:
  - node_modules/**
  - dist/**
  - build/**
  - work/**
  - outputs/**
  - .git/**
  - .reporook/**
requiredScanners: []
scanners:
  semgrep: true
  gitleaks: true
  npm-audit: true
  pip-audit: true
  osv-scanner: true
  checkov: true
  trivy-image: true
